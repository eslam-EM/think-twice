# Builds an installable Android APK on every push to main and publishes it as a GitHub Release asset.
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx tsc --noEmit && npx jest
      - run: npx expo prebuild --platform android --no-install
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk ThinkTwice.apk
      - uses: actions/upload-artifact@v4
        with: { name: ThinkTwice-apk, path: ThinkTwice.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Think Twice APK (build ${{ github.run_number }})
          body: Installable APK built automatically by GitHub Actions. Signed with the debug key (fine for installing directly; not for Google Play).
          files: ThinkTwice.apk
