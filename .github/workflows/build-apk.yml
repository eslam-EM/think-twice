# Builds an installable Android APK on every push to main and publishes it as a GitHub Release asset.
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies and run tests
        run: |
          set -o pipefail
          { npm ci && npx tsc --noEmit && npx jest; } 2>&1 | tee build.log
      - name: Generate Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee -a build.log
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Create a per-build release signing key (not stored anywhere)
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -alias thinktwice -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Think Twice, O=Think Twice, C=EG"
          {
            echo "TT_UPLOAD_STORE_FILE=$RUNNER_TEMP/release.p12"
            echo "TT_UPLOAD_STORE_PASSWORD=$PASS"
            echo "TT_UPLOAD_KEY_ALIAS=thinktwice"
            echo "TT_UPLOAD_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
      - name: Gradle assembleRelease
        working-directory: android
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 --no-daemon 2>&1 | tee -a ../build.log
      - name: Report error lines (readable from the API)
        if: failure()
        run: |
          grep -nE "error|Error|FAILED|What went wrong|Could not" build.log | tail -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          tail -15 build.log | while IFS= read -r l; do echo "::error::TAIL ${l:0:900}"; done
      - name: Verify signature is not the debug key
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee cert.txt
          if grep -q 'CN=Android Debug' cert.txt; then echo '::error::APK is debug-signed'; exit 1; fi
      - run: cp android/app/build/outputs/apk/release/app-release.apk ThinkTwice.apk
      - uses: actions/upload-artifact@v4
        with: { name: ThinkTwice-apk, path: ThinkTwice.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Think Twice APK (build ${{ github.run_number }})
          body: Installable APK built automatically by GitHub Actions, signed with a per-build release key. To update, uninstall the previous version first.
          files: ThinkTwice.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: ThinkTwice-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/smoke.sh
      - name: Attach screenshot and log to the release
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload build-${{ github.run_number }} smoke-screenshot.png logcat.txt --clobber -R ${{ github.repository }} || true
